name: whatmeal-deploy

x-mongo-image: &mongo-image mongo:8.0.38@sha256:479e85ced54ffb8a40dade1dcde2da2a9ae858515b9415e9cc54bfb8f0575d01

x-whatmeal-runtime: &whatmeal-runtime
  environment:
    AUTH_URL: ${AUTH_URL:?Set AUTH_URL to your HTTPS origin}
    NODE_ENV: production
    NEXT_PUBLIC_NOTIFICATIONS_ENABLED: "false"
  secrets:
    - mongo_app_password
    - auth_secret
  networks: [database]

services:
  mongo:
    image: *mongo-image
    entrypoint: ["bash", "/opt/deploy/start-mongo.sh"]
    command: ["mongod", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: whatmeal_root
    secrets:
      - mongo_root_password
    volumes:
      - mongo-data:/data/db
      - ./deploy/start-mongo.sh:/opt/deploy/start-mongo.sh:ro
    networks: [database]
    healthcheck:
      # Use the network listener, which is unavailable during local initialization.
      test: ["CMD", "mongosh", "--host", "mongo", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  mongo-provision:
    image: *mongo-image
    entrypoint: ["mongosh", "--nodb", "--quiet"]
    command: ["--file", "/opt/deploy/provision-mongo.js"]
    secrets:
      - mongo_root_password
      - mongo_app_password
    volumes:
      - ./deploy/provision-mongo.js:/opt/deploy/provision-mongo.js:ro
    networks: [database]
    depends_on:
      mongo:
        condition: service_healthy

  db-prepare:
    <<: *whatmeal-runtime
    build:
      context: .
      target: db-prepare
    depends_on:
      mongo-provision:
        condition: service_completed_successfully

  whatmeal:
    <<: *whatmeal-runtime
    networks: [backend, database]
    build:
      context: .
      target: runner
    depends_on:
      db-prepare:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    environment:
      AUTH_URL: ${AUTH_URL:?Set AUTH_URL to your HTTPS origin}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, backend]
    depends_on:
      whatmeal:
        condition: service_healthy
    restart: unless-stopped

secrets:
  auth_secret:
    file: ${WHATMEAL_SECRETS_DIR:?Set WHATMEAL_SECRETS_DIR}/auth-secret
  mongo_root_password:
    file: ${WHATMEAL_SECRETS_DIR:?Set WHATMEAL_SECRETS_DIR}/mongo-root-password
  mongo_app_password:
    file: ${WHATMEAL_SECRETS_DIR:?Set WHATMEAL_SECRETS_DIR}/mongo-app-password

networks:
  edge:
  backend:
    internal: true
  database:
    internal: true

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
